<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhantomPrint</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="pp-popup">
    <!-- Header -->
    <div class="pp-header">
      <div class="pp-logo">
        <img src="../icons/icon48.png" alt="PhantomPrint" width="24" height="24">
        <span class="pp-title">PhantomPrint</span>
      </div>
      <div class="pp-header-right">
        <span class="pp-version">v5.0</span>
        <label class="pp-toggle-switch" title="Enable/Disable PhantomPrint">
          <input type="checkbox" id="masterToggle">
          <span class="pp-toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="pp-status-bar" id="statusBar">
      <span class="pp-status-dot" id="statusDot"></span>
      <span id="statusText">Loading...</span>
      <span class="pp-status-domain" id="statusDomain"></span>
    </div>

    <!-- Profile Card -->
    <div class="pp-profile-card" id="profileCard">
      <div class="pp-profile-header">
        <div class="pp-profile-icon" id="profileIcon">🖥️</div>
        <div class="pp-profile-info">
          <div class="pp-profile-name" id="profileName">Loading...</div>
          <div class="pp-profile-sub" id="profileSub">—</div>
        </div>
        <div class="pp-profile-actions">
          <button class="pp-btn-icon" id="btnRandomize" title="New Random Fingerprint">🔀</button>
          <button class="pp-btn-icon" id="btnCopy" title="Copy Profile Info">📋</button>
        </div>
      </div>
      <div class="pp-profile-stats" id="profileStats">
        <div class="pp-stat"><span class="pp-stat-label">OS</span><span class="pp-stat-val" id="statOS">—</span></div>
        <div class="pp-stat"><span class="pp-stat-label">GPU</span><span class="pp-stat-val" id="statGPU">—</span></div>
        <div class="pp-stat"><span class="pp-stat-label">Screen</span><span class="pp-stat-val" id="statScreen">—</span></div>
        <div class="pp-stat"><span class="pp-stat-label">Cores</span><span class="pp-stat-val" id="statCores">—</span></div>
        <div class="pp-stat"><span class="pp-stat-label">RAM</span><span class="pp-stat-val" id="statRAM">—</span></div>
        <div class="pp-stat"><span class="pp-stat-label">TZ</span><span class="pp-stat-val" id="statTZ">—</span></div>
      </div>
    </div>

    <!-- Quick Modules -->
    <div class="pp-section-title">Protection Modules</div>
    <div class="pp-modules-grid" id="modulesGrid">
      <div class="pp-module" data-module="canvas">
        <span class="pp-module-icon">🎨</span>
        <span class="pp-module-name">Canvas</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="canvas"><span></span></label>
      </div>
      <div class="pp-module" data-module="webgl">
        <span class="pp-module-icon">🔷</span>
        <span class="pp-module-name">WebGL</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="webgl"><span></span></label>
      </div>
      <div class="pp-module" data-module="webgpu">
        <span class="pp-module-icon">⚡</span>
        <span class="pp-module-name">WebGPU</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="webgpu"><span></span></label>
      </div>
      <div class="pp-module" data-module="audio">
        <span class="pp-module-icon">🔊</span>
        <span class="pp-module-name">Audio</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="audio"><span></span></label>
      </div>
      <div class="pp-module" data-module="navigator">
        <span class="pp-module-icon">🧭</span>
        <span class="pp-module-name">Navigator</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="navigator"><span></span></label>
      </div>
      <div class="pp-module" data-module="fonts">
        <span class="pp-module-icon">🔤</span>
        <span class="pp-module-name">Fonts</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="fonts"><span></span></label>
      </div>
      <div class="pp-module" data-module="webrtc">
        <span class="pp-module-icon">📡</span>
        <span class="pp-module-name">WebRTC</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="webrtc"><span></span></label>
      </div>
      <div class="pp-module" data-module="geolocation">
        <span class="pp-module-icon">📍</span>
        <span class="pp-module-name">GeoLoc</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="geolocation"><span></span></label>
      </div>
      <div class="pp-module" data-module="timezone">
        <span class="pp-module-icon">🕐</span>
        <span class="pp-module-name">Timezone</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="timezone"><span></span></label>
      </div>
      <div class="pp-module" data-module="screen">
        <span class="pp-module-icon">🖥️</span>
        <span class="pp-module-name">Screen</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="screen"><span></span></label>
      </div>
      <div class="pp-module" data-module="battery">
        <span class="pp-module-icon">🔋</span>
        <span class="pp-module-name">Battery</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="battery"><span></span></label>
      </div>
      <div class="pp-module" data-module="timing">
        <span class="pp-module-icon">⏱️</span>
        <span class="pp-module-name">Timing</span>
        <label class="pp-mini-toggle"><input type="checkbox" class="module-toggle" data-module="timing"><span></span></label>
      </div>
    </div>

    <!-- Inline Notification Panel (replaces alert()) -->
    <div class="pp-notification" id="ppNotification" style="display:none">
      <span id="ppNotifText"></span>
      <button class="pp-notif-close" id="ppNotifClose">✕</button>
    </div>

    <!-- Action Buttons -->
    <div class="pp-actions">
      <button class="pp-btn pp-btn-primary" id="btnNewProfile">
        🎲 New Profile
      </button>
      <button class="pp-btn pp-btn-secondary" id="btnWhitelist">
        🚫 Whitelist Site
      </button>
    </div>

    <!-- Footer Links -->
    <div class="pp-footer">
      <button class="pp-footer-btn" id="btnOptions">⚙️ Options</button>
      <button class="pp-footer-btn" id="btnTest">🧪 Test</button>
      <button class="pp-footer-btn" id="btnHistory">📜 History</button>
    </div>

    <!-- History Panel (inline) -->
    <div class="pp-panel" id="historyPanel" style="display:none">
      <div class="pp-panel-header">
        <span>📜 Recent Activity</span>
        <button class="pp-panel-close" id="historyClose">✕</button>
      </div>
      <div class="pp-history-list" id="historyList">
        <div class="pp-empty">No history yet</div>
      </div>
      <button class="pp-btn pp-btn-danger pp-btn-sm" id="btnClearHistory">Clear History</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
