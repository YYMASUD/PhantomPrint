<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380, initial-scale=1.0">
  <title>PhantomPrint</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- HEADER -->
    <header class="header" id="header">
      <div class="header-left">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6C5CE7"/>
                <stop offset="100%" style="stop-color:#00D2FF"/>
              </linearGradient>
            </defs>
            <path d="M16 2L4 8v8c0 7.2 5.1 13.9 12 16 6.9-2.1 12-8.8 12-16V8L16 2z" fill="url(#logoGrad)" opacity="0.9"/>
            <path d="M16 6L8 10v6c0 5.2 3.4 9.8 8 11.2V6z" fill="rgba(255,255,255,0.15)"/>
            <path d="M13 14.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0zM18 14.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0zM12 18.5c0 0 2 2.5 4.5 2.5s4.5-2.5 4.5-2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <div class="header-title">
          <h1>PhantomPrint</h1>
          <span class="version" id="versionLabel">v3.0</span>
        </div>
      </div>
      <div class="header-right">
        <label class="master-toggle" id="masterToggle">
          <input type="checkbox" id="masterSwitch" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </header>

    <!-- PROTECTION SCORE -->
    <div class="score-section" id="scoreSection">
      <div class="score-gauge">
        <svg viewBox="0 0 120 120" class="gauge-svg">
          <circle cx="60" cy="60" r="50" class="gauge-bg"/>
          <circle cx="60" cy="60" r="50" class="gauge-fill" id="gaugeCircle"
            stroke-dasharray="314" stroke-dashoffset="62.8"/>
        </svg>
        <div class="gauge-label">
          <span class="gauge-value" id="scoreValue">80</span>
          <span class="gauge-unit">%</span>
        </div>
      </div>
      <div class="score-text">Protection Score</div>
    </div>

    <!-- PROFILE CARD -->
    <div class="profile-card" id="profileCard">
      <div class="profile-header">
        <span class="profile-name" id="profileName">Default Profile</span>
        <div class="randomize-group">
          <button class="btn-icon randomize-btn" id="randomizeBtn" title="Randomize fingerprint">🎲</button>
          <button class="btn-icon randomize-menu-btn" id="randomizeMenu" title="Constrained Randomization">▼</button>
          <div id="randomizeDropdown" class="randomize-dropdown hidden">
            <button class="dropdown-item" data-os="Windows" data-browser="Chrome">🪟 Win + Chrome</button>
            <button class="dropdown-item" data-os="macOS" data-browser="Safari">🍎 Mac + Safari</button>
            <button class="dropdown-item" data-os="macOS" data-browser="Chrome">🍎 Mac + Chrome</button>
            <button class="dropdown-item" data-os="Linux" data-browser="Firefox">🐧 Linux + Firefox</button>
            <button class="dropdown-item" data-os="Android" data-browser="Chrome">📱 Android + Chrome</button>
            <button class="dropdown-item" data-os="iOS" data-browser="Safari">📱 iOS + Safari</button>
            <hr class="dropdown-divider">
            <button class="dropdown-item" data-action="atoz">🔥 A–Z Full Random</button>
          </div>
        </div>
      </div>
      <div class="profile-grid">
        <div class="profile-item"><span class="pi-icon">🌐</span><span class="pi-label">Browser</span><span class="pi-value" id="profBrowser">Chrome 136</span></div>
        <div class="profile-item"><span class="pi-icon">💻</span><span class="pi-label">OS</span><span class="pi-value" id="profOS">Windows 11</span></div>
        <div class="profile-item"><span class="pi-icon">📐</span><span class="pi-label">Screen</span><span class="pi-value" id="profScreen">1920×1080</span></div>
        <div class="profile-item"><span class="pi-icon">🎮</span><span class="pi-label">GPU</span><span class="pi-value" id="profGPU" title="">NVIDIA RTX 4070</span></div>
        <div class="profile-item"><span class="pi-icon">🔌</span><span class="pi-label">Proxy</span><span class="pi-value" id="profProxy"><span class="status-dot dot-off"></span> Not Set</span></div>
      </div>
    </div>

    <!-- QUICK TOGGLES -->
    <div class="toggles-section" id="togglesSection">
      <h3 class="section-title">Quick Toggles</h3>
      <div class="toggles-grid" id="togglesGrid">
        <label class="toggle-item" data-cat="canvas"><span class="ti-icon">🖼️</span><span class="ti-label">Canvas</span><input type="checkbox" checked data-key="canvas"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="webgl"><span class="ti-icon">🧊</span><span class="ti-label">WebGL</span><input type="checkbox" checked data-key="webgl"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="audio"><span class="ti-icon">🔊</span><span class="ti-label">Audio</span><input type="checkbox" checked data-key="audio"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="webrtc"><span class="ti-icon">📡</span><span class="ti-label">WebRTC</span><input type="checkbox" checked data-key="webrtc"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="fonts"><span class="ti-icon">🔤</span><span class="ti-label">Fonts</span><input type="checkbox" checked data-key="fonts"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="timezone"><span class="ti-icon">🕐</span><span class="ti-label">Timezone</span><input type="checkbox" checked data-key="timezone"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="behavior"><span class="ti-icon">🤖</span><span class="ti-label">Behavior</span><input type="checkbox" checked data-key="behavior"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="headers"><span class="ti-icon">📨</span><span class="ti-label">Headers</span><input type="checkbox" checked data-key="headers"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="storage"><span class="ti-icon">💾</span><span class="ti-label">Storage</span><input type="checkbox" checked data-key="storage"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="proxy"><span class="ti-icon">🌍</span><span class="ti-label">Proxy</span><input type="checkbox" data-key="proxy"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="tracker" id="trackerToggleItem"><span class="ti-icon">🚫</span><span class="ti-label">Trackers</span><input type="checkbox" checked id="trackerToggle"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="replay" id="replayToggleItem"><span class="ti-icon">🎬</span><span class="ti-label">Replay</span><input type="checkbox" checked id="replayToggle"><span class="ti-switch"></span></label>
        <label class="toggle-item" data-cat="linkClean" id="linkToggleItem"><span class="ti-icon">🔗</span><span class="ti-label">Links</span><input type="checkbox" checked id="linkCleanToggle"><span class="ti-switch"></span></label>
      </div>
    </div>

    <!-- SITE INFO -->
    <div class="site-info" id="siteInfo">
      <div class="site-row">
        <div class="site-risk">
          <span class="risk-label">Site Risk:</span>
          <div class="risk-bar"><div class="risk-fill" id="riskFill" style="width:15%"></div></div>
          <span class="risk-score" id="riskScore">Low</span>
        </div>
        <div class="site-blocked">
          <span class="blocked-count" id="blockedCount">0</span>
          <span class="blocked-label">APIs blocked</span>
        </div>
      </div>
      <button class="btn-whitelist" id="whitelistBtn">☰ Whitelist Site</button>
    </div>

    <!-- FOOTER -->
    <footer class="footer" id="footer">
      <button class="footer-btn primary" id="dashboardBtn">📊 Dashboard</button>
      <button class="footer-btn" id="cookieBtn" title="Cookie Manager">🍪 Cookies</button>
      <button class="footer-btn" id="testBtn">🧪 Test</button>
      <button class="footer-btn icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
